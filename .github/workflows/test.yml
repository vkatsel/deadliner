name: Test Suite

on:
  push:
    branches:
      - "team-typed-aura/stage2"
      - "team-typed-aura/stage3"
      - "team-typed-aura/main"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run CI checks
        run: make ci
