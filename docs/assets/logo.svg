<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <!-- Background with subtle border -->
  <rect width="120" height="120" rx="26" fill="#08080A"/>
  <rect x="0.75" y="0.75" width="118.5" height="118.5" rx="25.25" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  
  <!-- Precise Technical Corner Marks -->
  <path d="M22 28 V22 H28 M98 28 V22 H92 M22 92 V98 H28 M98 92 V98 H92" stroke="rgba(255,255,255,0.25)" stroke-width="1.25" stroke-linecap="square"/>

  <!-- Subtle Horizontal Horizon Line -->
  <line x1="28" y1="60" x2="92" y2="60" stroke="rgba(255,255,255,0.1)" stroke-width="1" stroke-dasharray="2 3"/>

  <!-- Sharp Geometric Hourglass / Timeline Nexus -->
  <!-- Top Chamber -->
  <polygon points="34,34 86,34 60,60" stroke="#FFFFFF" stroke-width="2.2" stroke-linejoin="round" fill="rgba(255,255,255,0.02)"/>
  <!-- Bottom Chamber -->
  <polygon points="34,86 86,86 60,60" stroke="#FFFFFF" stroke-width="2.2" stroke-linejoin="round" fill="rgba(255,255,255,0.05)"/>
  
  <!-- Central Precision Diamond Core -->
  <polygon points="60,49 71,60 60,71 49,60" stroke="rgba(255,255,255,0.7)" stroke-width="1.5" stroke-linejoin="round" fill="rgba(255,255,255,0.08)"/>
  
  <!-- Precision Vertical Alignment Ticks -->
  <line x1="60" y1="24" x2="60" y2="29" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  <line x1="60" y1="91" x2="60" y2="96" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>

  <!-- Center Origin Point -->
  <circle cx="60" cy="60" r="2.25" fill="#FFFFFF"/>
</svg>
